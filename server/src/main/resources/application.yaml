spring:
  application:
    name: nis-web-portal-server
  profiles:
    active: default
  datasource:
    # Connection settings come from environment variables; never commit real values.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nis}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 400MB
      max-request-size: 400MB

approval:
  execution-base-url: ${APPROVAL_EXECUTION_BASE_URL:http://localhost:8010/api/nis-portal}
  internal-secret: ${APPROVAL_INTERNAL_SECRET:change-me}

app:
  upload:
    dir: ${UPLOAD_DIR:uploads}
  datasource:
    schema: public
  security:
    # Temporary password set by "reset password" in User Management
    reset-password: ${RESET_PASSWORD:}
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:5173}

mybatis:
  mapper-locations: classpath*:mappers/**/*.xml
  type-aliases-package: com.kh.niswebportal
  configuration:
    map-underscore-to-camel-case: true
server:
  port: 8010
  servlet:
    session:
      cookie:
        name: JSESSIONID
        http-only: true
        secure: false
        same-site: LAX
      timeout: 30m
    context-path: /api/nis-portal

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always
      probes:
        enabled: true
  health:
    defaults:
      enabled: false

logging:
  level:
    org.springframework: INFO
  logback:
    rollingpolicy:
      file-name-pattern: /APP_HOME/logs/archived/%d{yyyyMMdd}/${spring.application.name:app}-%d{yyyyMMddhhmm}-%i.log
      max-file-size: 100MB
  file:
    #    name: /APP_HOME/logs/${spring.application.name:app}-${spring.profiles.active:default}.log
    name: ./logs/${spring.application.name:app}-${spring.profiles.active:default}.log
  pattern:
    console: '{"timestamp":"%d{ISO8601}","id":"%green([%X{im_log}])","op":"%yellow([%X{op}])","level":"%level","thread":"%thread","class":"%logger{36}","message":"%message"}%n'
    file: '{"timestamp":"%d{ISO8601}","id":"[%X{im_log}]","op":"[%X{op}]","level":"%level","thread":"%thread","class":"%logger{36}","message":"%message"}%n'